name: healthy_project
description: Upload medical lab reports (PDF/Word) and get clear, actionable insights.
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.1.9
  google_fonts: ^6.2.1
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  syncfusion_flutter_pdf: ^29.1.38
  archive: ^4.0.7
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  share_plus: ^12.0.2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  url_launcher: ^6.3.2
  http: ^1.6.0
  crypto: ^3.0.6
  sign_in_with_apple: ^7.0.1
  health: ^13.3.1
  table_calendar: ^3.2.1
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0B6E6A"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true


  # Goal	Command
  # TestFlight
  # cd ios && bundle exec fastlane beta
  #  App Store
  # cd ios && bundle exec fastlane release
  # Firebase (iOS testers)
  # cd ios && bundle exec fastlane firebase
  #  Android APK
  # cd android && bundle exec fastlane apk
  # Google Play internal
  # cd android && bundle exec fastlane beta
  #  Google Play production
  # cd android && bundle exec fastlane release
  #  Firebase (Android testers)
  #  cd android && bundle exec fastlane firebase
  # Tests before shipping
  # cd ios && bundle exec fastlane check